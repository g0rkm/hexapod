# =============================================================================
# hexapod / config/robot.yaml
# =============================================================================
# Robotun fiziksel tanımı. Elle ayarlanan servo offset'leri burada DEĞİL,
# config/calibration.yaml içindedir (proje brifi §4).
#
# HER SAYISAL ALAN üç bilgiyle tutulur:
#   value    : kullanılacak değer. Bilinmiyorsa null.
#   source   : değerin nereden geldiği.
#   measured : true  -> monte edilmiş robottan ölçüldü, güvenilir.
#              false -> CAD'den/veri sayfasından türetildi, DOĞRULANMADI.
#
# KURAL: value=null olan bir alanı hiçbir kod katmanı varsayılanla dolduramaz.
#        Yükleyici (hexapod_driver.config) o alan gerektiğinde hata verir.
#        measured=false olan değerler çalışır ama "doğru" sayılmaz.
# =============================================================================

schema_version: 1

meta:
  name: hexapod
  # CAD kaynağı: Sir Kuhnhero "3D Printed Hexapod", Printables model 606030,
  # CC BY-SA 4.0. Mekanik geometri bu tasarımdan; elektronik DEĞİL
  # (donör tasarım STM32 + 4x18650 kullanıyor, bu robot Pi 4 + 2S LiPo).
  cad_source: "Hexapod/ (Printables 606030, CC BY-SA 4.0)"

units:
  length: mm
  angle: deg
  time: s

# -----------------------------------------------------------------------------
# Koordinat çerçeveleri
# -----------------------------------------------------------------------------
frames:
  # CAD çerçevesi (hexapod-v8.step içindeki ham eksenler):
  #   +Y yukarı, X ve Z yatay düzlem. Bacak azimutu = atan2(z, x).
  # Gövde çerçevesi (ROS REP-103): +X ileri, +Y sol, +Z yukarı.
  cad:
    up_axis: "+Y"
    azimuth_definition: "atan2(z, x)"
  body:
    convention: "REP-103: +X ileri, +Y sol, +Z yukarı"
    # İleri yönün CAD çerçevesindeki azimutu.
    #
    # Robot simetrik: altı bacağın geometrisi aynı, 60 derece aralıklı. IK
    # için hangi tarafın ön sayıldığı önemsiz, bu yüzden keyfi seçildi.
    # (Aynalı bacakların eklem yön işaretleri kalibrasyonda zaten eklem
    # eklem belirleniyor.)
    #
    # Dönüşüm:  govde_azimut = forward_offset_deg - cad_azimut
    # İşaret ters çünkü CAD azimutu atan2(z,x) yukarıdan bakınca saat
    # yönünde artar; gövde çerçevesinde (REP-103, +Z yukarı) saat yönünün
    # tersine artar.
    forward_offset_deg:
      value: 90.0
      source: "Keyfi seçildi (robot simetrik, ön önemsiz) - CAD +Z ileri kabul edildi"
      measured: false

# -----------------------------------------------------------------------------
# Bacak kinematiği
# -----------------------------------------------------------------------------
# Eklem sırası: coxa (yaw, dikey eksen) -> femur (pitch) -> tibia (pitch).
# 3 DOF x 6 bacak = 18 servo.
#   Kanıt: Malzeme Listesi.txt "Total: 18x MG996R Servo Horn";
#          leg-v2-v20.step içinde tam 3 MG996R + 3 horn + 3 bushing.
#
# Eklem eksenleri leg-v2-v20.step'ten çıkarıldı. Yöntem: her eklemin ekseni,
# servo horn'un merkezi ile karşısındaki bushing'in merkezini birleştiren doğru.
# Bacak yerel çerçevesi: +Y yukarı, bacak -Z yönünde dışarı uzanıyor.
#   J1 coxa yaw : yerel Y boyunca, (x=0,      z=+20.00)
#   J2 femur    : yerel X boyunca, (y=-10.05, z=-30.00)
#   J3 tibia    : yerel X boyunca, (y=+10.66, z=-107.27)
leg:
  segments:
    coxa:
      # J1 yaw ekseninden J2 femur eklemine yatay mesafe.
      value: 50.0
      source: "CAD: leg-v2-v20.step, J1(z=+20) -> J2(z=-30). Tam 50.000 çıktı."
      measured: false
    femur:
      # J2 ekseninden J3 eksenine mesafe.
      value: 80.0
      source: "CAD: leg-v2-v20.step, J2->J3 = 79.997 mm. Tasarım değeri 80."
      measured: false
    tibia:
      # J3 ekseninden ayak kapağının en uç noktasına mesafe.
      #
      # Ayak kapağı (pla_tibia_tip) tibia gövdesinin ucuna geçiyor ve onu
      # 8 mm aşıyor; yere değen parça kapak. Gövdenin ucu 118.6 mm'de.
      #
      # DÜZELTME (2026-09-24): ilk türetmede 121.0 yazılmıştı. STEP içinde
      # parça adı -> geometri eşlemesi tip ile main için ters çıkıyordu ve
      # değer yanlış parçanın B-spline kontrol noktalarından gelmişti.
      # Doğru değer basılan STL'lerden (mesh köşeleri yüzeyin tam üstünde).
      #
      # Ayak ucu yaklaşık 5 mm yarıçaplı yuvarlak; yere değen nokta tibia
      # açısıyla ~r*sin(açı) kadar kayar (normal duruşta 1-3 mm). İhmal edildi.
      value: 126.6
      source: "CAD: pla_tibia_tip.stl + leg-v2-v20.step montaj dönüşümü, J3 -> uç 126.635 mm (tools/cad_extract.py)"
      measured: false

  # J2 femur ekleminin, bacak montaj referans düzlemine göre dikey ofseti.
  # Negatif = aşağıda. IK'da bacak orijinini doğru yüksekliğe oturtmak için.
  femur_joint_z_offset:
    value: -10.05
    source: "CAD: leg-v2-v20.step, J2 ekseni y=-10.05 (montaj orijinine göre)"
    measured: false

# -----------------------------------------------------------------------------
# Gövde geometrisi
# -----------------------------------------------------------------------------
body:
  # Coxa yaw eksenlerinin geçtiği çemberin yarıçapı.
  # DİKKAT: bacak montaj orijinleri 120 mm'de, ama IK'nın ihtiyaç duyduğu
  # coxa dönme ekseni bundan 20 mm içeride, yani 100 mm'de.
  coxa_axis_radius:
    value: 100.0
    source: "CAD: hexapod-v8.step, bacak orijinleri r=120 + yerel z=+20 ofset"
    measured: false

  standing_height:
    value: null
    source: "ÖLÇÜM BEKLİYOR - ayakta dururken gövde alt yüzeyinin yerden yüksekliği"
    measured: false

  total_mass_kg:
    value: null
    source: "ÖLÇÜM BEKLİYOR - gait tempo/duty cycle hesabı için"
    measured: false

# -----------------------------------------------------------------------------
# Bacaklar
# -----------------------------------------------------------------------------
# azimuth_deg CAD çerçevesindedir (izlenebilirlik için öyle bırakıldı).
# Gövde çerçevesindeki karşılığı: forward_offset_deg - azimuth_deg.
#
#   id  CAD az.  gövde az.  konum       fiziksel bant no.
#   0      0        +90     sol orta     6
#   1     60        +30     sol ön       1
#   2    120        -30     sağ ön       2
#   3    180        -90     sağ orta     3
#   4   -120       -150     sağ arka     4
#   5    -60       +150     sol arka     5
#
# "Fiziksel bant no." tools/map_channels.py'nin sorduğu numaralardır
# (ÖN bandından başlayıp yukarıdan bakınca saat yönünde 1-6).
#
# mirrored: true olan 3 bacak aynalı basılmış (CAD'de "leg v2 - Mirrored").
# Kinematik olarak aynalı bacak normal bacakla aynıdır (eklem eksenleri
# bacak düzleminde aynı yerde); fark yalnızca servo yön işaretlerinde
# olabilir ve o da calibration.yaml'da eklem eklem belirlenir. Robot
# fiziksel olarak başka bir "ön" ile kurulursa bu alan yanlış tarafı
# gösterebilir; bilgi amaçlıdır, hiçbir hesap buna dayanmaz.
legs:
  - {id: 0, azimuth_deg:    0.0, mirrored: false, label: "sol orta"}
  - {id: 1, azimuth_deg:   60.0, mirrored: false, label: "sol ön"}
  - {id: 2, azimuth_deg:  120.0, mirrored: true,  label: "sağ ön"}
  - {id: 3, azimuth_deg:  180.0, mirrored: true,  label: "sağ orta"}
  - {id: 4, azimuth_deg: -120.0, mirrored: true,  label: "sağ arka"}
  - {id: 5, azimuth_deg:  -60.0, mirrored: false, label: "sol arka"}

# -----------------------------------------------------------------------------
# Servo donanımı
# -----------------------------------------------------------------------------
servo:
  model: MG996R
  # Robotistan faturasında "MG996R Yüksek Torklu Servo Motor - 180 Derece",
  # 20 adet (18 kullanım + 2 yedek).
  nominal_range_deg: 180.0

  # PWM taşıyıcı frekansı. Analog hobi servolar için standart 50 Hz.
  # Bu bir robot ölçümü değil, bir yapılandırma tercihi.
  pwm_frequency_hz: 50.0

  # Darbe genişliği uçları. MG996R için katalog değeri ~500-2500 us ama
  # birim birim sapar ve mekanik limitlere çarpabilir.
  # tools/calibrate.py gerçek değerleri eklem başına calibration.yaml'a yazar.
  # Buradakiler yalnızca MUTLAK GÜVENLİK SINIRI: sürücü katmanı bu aralığın
  # dışına asla darbe göndermez.
  pulse_us_hard_limits:
    min: 500
    max: 2500

# -----------------------------------------------------------------------------
# PWM sürücü kartları
# -----------------------------------------------------------------------------
# 18 servo, 16 kanallı kart -> 2 kart zorunlu.
#   Fatura: earsiv_faturaRA42026000000179.pdf -> "PCA9685 16 Kanal ... 2 Adet"
#   CAD   : body-v35.step içinde 2 adet PCA9685 yerleşik.
#   NOT   : "gömülü malzemeler listesi.txt" 1 adet diyor -> liste güncel değil.
drivers:
  - id: 0
    type: PCA9685
    i2c_bus: 1
    address:
      value: null
      source: "KARAR BEKLİYOR - A0..A5 jumper konfigürasyonu (fabrika 0x40)"
      measured: false
  - id: 1
    type: PCA9685
    i2c_bus: 1
    address:
      value: null
      source: "KARAR BEKLİYOR - ikinci kartın adresi (ör. A0 lehimli -> 0x41)"
      measured: false

# -----------------------------------------------------------------------------
# Eklem -> servo kanalı haritası
# -----------------------------------------------------------------------------
# driver/channel : KABLOLAMA. Robot kablolandıktan sonra elle doldurulacak.
# limits_deg     : mekanik eklem limitleri, ÖLÇÜM BEKLİYOR.
#                  Sıfır açı = calibration.yaml içindeki center_us konumu.
#
# Yön işareti (direction) ve merkez darbesi burada DEĞİL, calibration.yaml'da.
joints:
  - {leg: 0, joint: coxa,  driver: null, channel: null, limits_deg: {min: null, max: null}}
  - {leg: 0, joint: femur, driver: null, channel: null, limits_deg: {min: null, max: null}}
  - {leg: 0, joint: tibia, driver: null, channel: null, limits_deg: {min: null, max: null}}
  - {leg: 1, joint: coxa,  driver: null, channel: null, limits_deg: {min: null, max: null}}
  - {leg: 1, joint: femur, driver: null, channel: null, limits_deg: {min: null, max: null}}
  - {leg: 1, joint: tibia, driver: null, channel: null, limits_deg: {min: null, max: null}}
  - {leg: 2, joint: coxa,  driver: null, channel: null, limits_deg: {min: null, max: null}}
  - {leg: 2, joint: femur, driver: null, channel: null, limits_deg: {min: null, max: null}}
  - {leg: 2, joint: tibia, driver: null, channel: null, limits_deg: {min: null, max: null}}
  - {leg: 3, joint: coxa,  driver: null, channel: null, limits_deg: {min: null, max: null}}
  - {leg: 3, joint: femur, driver: null, channel: null, limits_deg: {min: null, max: null}}
  - {leg: 3, joint: tibia, driver: null, channel: null, limits_deg: {min: null, max: null}}
  - {leg: 4, joint: coxa,  driver: null, channel: null, limits_deg: {min: null, max: null}}
  - {leg: 4, joint: femur, driver: null, channel: null, limits_deg: {min: null, max: null}}
  - {leg: 4, joint: tibia, driver: null, channel: null, limits_deg: {min: null, max: null}}
  - {leg: 5, joint: coxa,  driver: null, channel: null, limits_deg: {min: null, max: null}}
  - {leg: 5, joint: femur, driver: null, channel: null, limits_deg: {min: null, max: null}}
  - {leg: 5, joint: tibia, driver: null, channel: null, limits_deg: {min: null, max: null}}

# -----------------------------------------------------------------------------
# Sensörler (faturalarla doğrulandı, montaj bilgisi eksik)
# -----------------------------------------------------------------------------
sensors:
  imu:
    model: "BNO055 + BMP280 (Gravity 10DOF AHRS)"
    interface: i2c
    i2c_bus: 1
    address:
      value: null
      source: "KARAR BEKLİYOR (BNO055 fabrika adresi 0x28/0x29)"
      measured: false
    mount_rotation_deg:
      value: null
      source: "ÖLÇÜM BEKLİYOR - IMU'nun gövde çerçevesine göre montaj yönelimi"
      measured: false

  range_finders:
    # 3 adet VL53L0X alındı (R3D2026000002246.pdf). Hepsi 0x29 adresinde doğar;
    # ayrı XSHUT pinleriyle sırayla uyandırılıp yeniden adreslenmeleri gerekir.
    model: VL53L0X
    count: 3
    interface: i2c
    i2c_bus: 1
    devices:
      - {id: 0, xshut_gpio: null, address: null, direction_deg: null}
      - {id: 1, xshut_gpio: null, address: null, direction_deg: null}
      - {id: 2, xshut_gpio: null, address: null, direction_deg: null}

  camera:
    model: "Raspberry Pi Camera Module V2"
    interface: csi
