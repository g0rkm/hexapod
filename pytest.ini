[pytest]
testpaths = tests
# ROS 2'nin launch_testing pytest eklentileri (launch_testing, launch_ros) bu
# projede kullanılmıyor ve pytest 9 ile toplamayı bozuyor: bir test dosyasının
# modül düzeyindeki atlaması (ör. SB3 yok) başka dosyaların toplanmasını da
# engelliyordu ("found no collectors"). Temiz Ubuntu'daki Pi kurulum
# denemesinde bulundu (2026-09-29); geliştirme ortamında SB3 kurulu olduğu
# için görünmüyordu. launch_ros, launch_testing'in kancasına bağlı: ikisi birden.
addopts = -p no:launch_ros -p no:launch_testing
